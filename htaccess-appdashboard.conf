# BEGIN AppDashboard (généré par scripts/htaccess-o2switch.mjs : ne pas modifier entre ces lignes)
Options -Indexes
DirectoryIndex index.html
AddType application/manifest+json .webmanifest
AddType application/javascript .jsbundle
AddType application/wasm .wasm

# Fichiers cachés, sauvegardes, journaux et cartes de sources : jamais servis.
RedirectMatch 404 "/\.(?!well-known/)"
RedirectMatch 404 "(?i)\.(bak|old|orig|save|swp|sql|log|map|env|ini|sh|lock)$"

# Compression des textes : brotli si disponible, sinon gzip (mod_deflate). Sans module : fichiers servis tels quels.
<IfModule mod_filter.c>
  <IfModule mod_brotli.c>
    AddOutputFilterByType BROTLI_COMPRESS text/html text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml application/wasm
  </IfModule>
  <IfModule !mod_brotli.c>
    <IfModule mod_deflate.c>
      AddOutputFilterByType DEFLATE text/html text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml application/wasm
    </IfModule>
  </IfModule>
</IfModule>

<IfModule mod_rewrite.c>
RewriteEngine On
# HTTPS obligatoire (sauf la validation Let’s Encrypt).
RewriteCond %{HTTPS} !=on
RewriteCond %{REQUEST_URI} !^/\.well-known/
RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
# Application d’une page : une adresse inconnue sert index.html.
RewriteCond %{REQUEST_FILENAME} !-f
RewriteCond %{REQUEST_FILENAME} !-d
RewriteCond %{REQUEST_URI} !^/(assets|maj|esport-assets|\.well-known)/
RewriteRule ^ index.html [L]
</IfModule>

<IfModule mod_headers.c>
Header always set X-Content-Type-Options "nosniff"
# index.html, manifeste, configuration (esport.json, relais.json) et mises à jour : revalidés à chaque visite.
<FilesMatch "\.(html|json|webmanifest|jsbundle)$">
  Header set Cache-Control "no-cache"
</FilesMatch>
<If "%{REQUEST_URI} =~ m#^/.*$#">
  Header set Strict-Transport-Security "max-age=31536000; includeSubDomains"
  Header set Referrer-Policy "strict-origin-when-cross-origin"
  Header set X-Frame-Options "SAMEORIGIN"
  Header set Permissions-Policy "geolocation=(), payment=(), usb=(), serial=(), interest-cohort=()"
</If>
<If "%{REQUEST_URI} =~ m#^/assets/.*$#">
  Header set Cache-Control "public, max-age=31536000, immutable"
</If>
<If "%{REQUEST_URI} =~ m#^/version\.json$#">
  Header set Cache-Control "no-cache, no-store, must-revalidate"
</If>
</IfModule>
# END AppDashboard
