<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AppDashboard — aperçu</title>
    <style>
      html, body, #racine { height: 100%; margin: 0; }
      /* La fenêtre ne défile jamais : chaque écran fait défiler son propre
         contenu, et la barre latérale reste en place. */
      html, body { overflow: hidden; }
      #racine { display: flex; flex-direction: column; }
      /* Polices du thème (Paramètres › Apparence). Sans thème à police, les
         variables sont absentes et chaque texte garde la sienne. */
      body * { font-family: var(--police-texte) !important; }
      [data-police="titre"], [data-police="titre"] * { font-family: var(--police-titre, var(--police-texte)) !important; }
      body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
    </style>
  </head>
  <body>
    <!-- Aperçu de développement : npm run bureau, puis /apercu.html -->
    <div id="racine"></div>
    <script type="module" src="./sonde.tsx"></script>
  </body>
</html>
