<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>Mon Budget</title>
  <meta name="description" content="Suivi de budget personnel, candidatures et projets" />
  <meta name="theme-color" content="#4F46E5" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Mon Budget" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <style>
    html, body { background: #f4f5fb; }
    @media (prefers-color-scheme: dark) { html, body { background: #101120; } }
  </style>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <h1 id="page-title">Tableau de bord</h1>
    </header>
    <main id="view-root"></main>
    <button id="fab-add" class="fab" aria-label="Ajouter une transaction">+</button>
    <nav class="tabbar">
      <button data-tab="dashboard" class="tab-btn active">
        <span class="icon">📊</span><span>Budget</span>
      </button>
      <button data-tab="transactions" class="tab-btn">
        <span class="icon">🧾</span><span>Transactions</span>
      </button>
      <button data-tab="categories" class="tab-btn">
        <span class="icon">🏷️</span><span>Catégories</span>
      </button>
    </nav>
  </div>
  <div id="modal-root"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
