<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="480" viewBox="0 0 1360 480">
  <!-- Bannière du bot Esport (profil et carte de l'application) : 17:6, comme Discord. -->
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.6" stop-color="#121a3a"/>
      <stop offset="1" stop-color="#1d1340"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7aa2ff"/>
      <stop offset="0.5" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="halo" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <pattern id="grille" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#5b8cff" stroke-opacity="0.08" stroke-width="1.5"/>
    </pattern>
  </defs>
  <rect width="1360" height="480" fill="url(#fond)"/>
  <rect width="1360" height="480" fill="url(#grille)"/>
  <!-- Bandes diagonales aux couleurs des types d'événements -->
  <g opacity="0.9">
    <path d="M1110 480 L1230 0 H1260 L1140 480 Z" fill="#7c3aed"/>
    <path d="M1170 480 L1290 0 H1310 L1190 480 Z" fill="#dc2626"/>
    <path d="M1215 480 L1335 0 H1350 L1230 480 Z" fill="#d97706"/>
    <path d="M1250 480 L1370 0 H1380 L1260 480 Z" fill="#2563eb"/>
    <path d="M1278 480 L1398 0 H1404 L1284 480 Z" fill="#0891b2"/>
  </g>
  <!-- Emblème -->
  <path d="M240 110 L370 240 L240 370 L110 240 Z" fill="#5b8cff" opacity="0.4" filter="url(#halo)"/>
  <path d="M240 96 L384 240 L240 384 L96 240 Z" fill="none" stroke="url(#accent)" stroke-width="16" stroke-linejoin="round"/>
  <path d="M240 150 L330 240 L240 330 L150 240 Z" fill="url(#accent)"/>
  <path d="M214 200 L254 240 L214 280" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M262 280 H286" stroke="#ffffff" stroke-width="20" stroke-linecap="round"/>
  <!-- Texte -->
  <text x="450" y="228" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="88" letter-spacing="4" fill="#ffffff">ESPORT HQ</text>
  <text x="454" y="292" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-weight="500" font-size="34" fill="#aab8e6">Scrims · Matchs · Rappels · Présences</text>
  <rect x="454" y="326" width="120" height="8" rx="4" fill="url(#accent)"/>
</svg>
