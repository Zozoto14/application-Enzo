# Relais AppDashboard : déployé par `npm run relais:deployer` (scripts/deployer-relais.mjs),
# qui crée la boîte (KV), renseigne son identifiant ci-dessous et tire le jeton.
name = "applibourse-relais"
main = "worker.mjs"
compatibility_date = "2026-09-01"

# L'identifiant est écrit par le script de déploiement.
[[kv_namespaces]]
binding = "BOITE"
id = "A_REMPLIR_PAR_LE_SCRIPT"

# Origines (séparées par des virgules) dont le navigateur peut appeler la
# lecture des sources de Tsuzuku (`/tsuzuku/requete`). Ce n'est pas un secret :
# la même adresse que src/config/site.json. Facultatif : LIMITE_TSUZUKU_MINUTE
# (60 requêtes par minute par défaut).
[vars]
ORIGINES_SITE = "https://applibourse-ef0ddb.pages.dev"
